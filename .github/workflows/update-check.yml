name: Check for Upstream Updates

on:
  schedule:
    - cron: '0 8 * * *' # 8 AM daily
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check for updates
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT_WITH_PR_PERMISSION }}
        run: python .github/scripts/check_updates.py

      - name: Create Pull Request
        if: steps.check.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_PAT_WITH_PR_PERMISSION }}
          commit-message: "chore(deps): update caddy dependencies"
          title: "chore(deps): update caddy dependencies"
          body: |
            Automated dependency updates:
            ${{ steps.check.outputs.updates }}
          branch: update-dependencies
          base: caddy
          delete-branch: true