name: Build Caddy with Modules

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:
  push:
    branches:
      - caddy
    paths:
      - 'Dockerfile'
      - '.github/workflows/caddy.yml'
  pull_request:
    branches:
      - caddy
    paths:
      - 'Dockerfile'
      - '.github/workflows/caddy.yml'

env:
  REGISTRY: ghcr.io
  # Image name should be owner/caddy
  IMAGE_NAME: ${{ github.repository_owner }}/caddy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=raw,value={{date 'YYYYMMDD'}},enable={{is_default_branch}}
            type=sha,enable=false

      # Test build first (linux/amd64 only) to verify modules
      - name: Build and export to Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: test-caddy:latest
          platforms: linux/amd64
      
      - name: Verify modules
        run: |
          docker run --rm test-caddy:latest caddy list-modules | grep "cache"
          docker run --rm test-caddy:latest caddy list-modules | grep "http.handlers.webdav"
          docker run --rm test-caddy:latest caddy version

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max